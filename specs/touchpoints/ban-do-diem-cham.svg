<text x="1047" y="870.5" font-size="12.5" fill="#E8590C">★</text>
<text x="1063" y="870.5" font-size="12.6" fill="#212529">Đơn bị huỷ sau khi đã gửi bếp → TỰ in phiếu báo huỷ</text>
<text x="1063" y="887.5" font-size="12.6" fill="#212529">để bếp dừng nấu</text>
<rect x="24" y="921" width="176" height="115" rx="7" fill="#F1F3F5" stroke="#DEE2E6"/>
<text x="38" y="976" font-size="13.6" font-weight="700" fill="#212529">Tài xế</text>
<text x="38" y="992" font-size="11" fill="#868E96">điểm bàn giao</text>
<rect x="1036" y="931" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#E8590C" stroke-width="1.4"/>
<text x="1047" y="952.5" font-size="12.5" fill="#E8590C">★</text>
<text x="1063" y="952.5" font-size="12.6" fill="#212529">Đến lấy hàng — đối chiếu MÃ RÚT GỌN 4–6 ký tự cỡ</text>
<text x="1063" y="969.5" font-size="12.6" fill="#212529">lớn + danh sách món</text>
<rect x="1036" y="991" width="376" height="35" rx="6" fill="#FFF4F4" stroke="#E03131" stroke-width="1.4"/>
