<rect x="1036" y="527" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#E8590C" stroke-width="1.4"/>
<text x="1047" y="548.5" font-size="12.5" fill="#E8590C">★</text>
<text x="1063" y="548.5" font-size="12.6" fill="#212529">Đơn về: chuông + nhấp nháy tab LIÊN TỤC đến khi có</text>
<text x="1063" y="565.5" font-size="12.6" fill="#212529">người xử lý — đứng xa PC vẫn biết</text>
<rect x="1036" y="587" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#E8590C" stroke-width="1.4"/>
<text x="1047" y="608.5" font-size="12.5" fill="#E8590C">★</text>
<text x="1063" y="608.5" font-size="12.6" fill="#212529">Xác nhận thủ công, hoặc đếm ngược TỰ xác nhận sau</text>
<text x="1063" y="625.5" font-size="12.6" fill="#212529">~2 phút</text>
<rect x="1036" y="647" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1"/>
<text x="1047" y="668.5" font-size="12.6" fill="#343A40">Từ chối / báo hết món / báo trễ — có lý do sẵn, một</text>
<text x="1047" y="685.5" font-size="12.6" fill="#343A40">chạm</text>
