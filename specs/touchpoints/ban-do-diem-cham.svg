<text x="247" y="346.5" font-size="12.6" fill="#212529">Không phải nhập bất kỳ mã kỹ thuật nào</text>
<rect x="628" y="282" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#0CA678" stroke-width="1.4"/>
<text x="639" y="303.5" font-size="12.5" fill="#0CA678">★</text>
<text x="655" y="303.5" font-size="12.6" fill="#212529">Duyệt các cặp món hệ thống TỰ khớp tên (~80%) —</text>
<text x="655" y="320.5" font-size="12.6" fill="#212529">chỉ sửa chỗ chưa khớp</text>
<rect x="628" y="342" width="376" height="35" rx="6" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1"/>
<text x="639" y="363.5" font-size="12.6" fill="#343A40">Đặt giá bán Shopee, giờ mở/đóng cửa, ngày lễ</text>
<rect x="628" y="385" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#0CA678" stroke-width="1.4"/>
<text x="639" y="406.5" font-size="12.5" fill="#0CA678">★</text>
<text x="655" y="406.5" font-size="12.6" fill="#212529">Tạm ngưng bán TỨC THÌ khi hết nguyên liệu — không</text>
<text x="655" y="423.5" font-size="12.6" fill="#212529">đợi đến giờ đóng cửa</text>
<rect x="628" y="445" width="376" height="52" rx="6" fill="#FFF4F4" stroke="#E03131" stroke-width="1.4"/>
<text x="639" y="466.5" font-size="12.5" fill="#E03131">⚠</text>
<text x="655" y="466.5" font-size="12.6" fill="#A61E1E">Món chưa ghép nối sẽ bị XOÁ trên Shopee khi đồng bộ</text>
<text x="655" y="483.5" font-size="12.6" fill="#A61E1E">toàn bộ → bắt buộc ghép trước, cảnh báo đỏ</text>
<rect x="1444" y="282" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1"/>
<text x="1455" y="303.5" font-size="12.6" fill="#343A40">Tiền quán THỰC NHẬN (đã trừ hoa hồng, thuế, KM quán</text>
<text x="1455" y="320.5" font-size="12.6" fill="#343A40">tài trợ)</text>
<rect x="1444" y="342" width="376" height="35" rx="6" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1"/>
<text x="1455" y="363.5" font-size="12.6" fill="#343A40">Hiệu suất kênh ShopeeFood từ khi kết nối</text>
