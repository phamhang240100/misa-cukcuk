<text x="1063" y="1012.5" font-size="12.6" fill="#A61E1E">Từ thời điểm tài xế lấy hàng: KHOÁ nút Huỷ đơn</text>
<rect x="24" y="1050" width="1806" height="40" rx="7" fill="#F8F9FA" stroke="#E9ECEF"/>
<text x="38" y="1075" font-size="12.4" fill="#495057"><tspan fill="#E8590C" font-size="13">★</tspan> điểm cải tiến trải nghiệm so với bản phác thảo ban đầu &#160;&#160;&#160;<tspan fill="#E03131" font-size="13">⚠</tspan> ràng buộc bắt buộc phải tuân thủ (rủi ro nghiệp vụ)&#160;&#160;&#160;—&#160; Chi tiết từng nhánh: sơ đồ swimlane từng luồng (phụ lục)</text>
