<rect x="1036" y="140" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#CED4DA" stroke-width="1"/>
<text x="1047" y="161.5" font-size="12.6" fill="#343A40">Đặt món &amp; trả tiền trên app ShopeeFood — quán không</text>
<text x="1047" y="178.5" font-size="12.6" fill="#343A40">thu tiền của khách</text>
<rect x="1036" y="200" width="376" height="52" rx="6" fill="#FFFFFF" stroke="#E8590C" stroke-width="1.4"/>
<text x="1047" y="221.5" font-size="12.5" fill="#E8590C">★</text>
<text x="1063" y="221.5" font-size="12.6" fill="#212529">Nhận hàng → đơn TỰ chuyển Hoàn thành, nhân viên</text>
<text x="1063" y="238.5" font-size="12.6" fill="#212529">không phải nhớ bấm</text>
<rect x="24" y="272" width="176" height="235" rx="7" fill="#F1F3F5" stroke="#DEE2E6"/>
<text x="38" y="386" font-size="13.6" font-weight="700" fill="#212529">Chủ quán</text>
<text x="38" y="404" font-size="11" fill="#868E96">web CukCuk</text>
