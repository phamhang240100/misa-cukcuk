<text x="1047" y="728.5" font-size="12.5" fill="#E8590C">★</text>
<text x="1063" y="728.5" font-size="12.6" fill="#212529">KHÔNG còn màn tính tiền. Chỉ hiển thị: Khách trả</text>
<text x="1063" y="745.5" font-size="12.6" fill="#212529">Shopee X · Quán thực nhận Y · trạng thái đối soát</text>
